name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write CI env file
        run: cp .env.example .env

      - name: Build lint image
        run: docker compose build lint

      - name: Run ruff
        run: docker compose run --rm lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write CI env file
        run: cp .env.example .env

      - name: Build test image
        run: docker compose build test

      - name: Run pytest inside Docker
        run: docker compose run --rm test

  notify:
    needs: [ lint, test ]
    if: github.event_name == 'pull_request' && success()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **All automated tests and lint passed successfully in CI!**\n\nThis pull request has been fully validated and is ready to be merged.`
            })
